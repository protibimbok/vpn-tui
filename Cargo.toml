[package]
name = "vpn"
version = "0.1.1"
edition = "2024"
description = "TUI for managing Surfshark and ProtonVPN WireGuard connections"
license = "MIT"
repository = "https://github.com/protibimbok/vpn-tui"
homepage = "https://github.com/protibimbok/vpn-tui"
authors = ["Saad <sakib.saad.khan@gmail.com>"]


[dependencies]
async-trait = "0.1.89"
base64 = "0.22"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "5"
futures = "0.3.32"
libc = "0.2"
qrcode = { version = "0.14.1", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
# ProtonVPN: native SRP-6a login + Ed25519→X25519 WireGuard key derivation.
bcrypt = "0.15"
ed25519-dalek = { version = "2", features = ["rand_core"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
pgp = "0.13"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
